services:
  backend:
    environment:
      APP_ENV: development
      SUPABASE_URL: http://host.docker.internal:54321
      SUPABASE_PUBLIC_URL: http://127.0.0.1:54321
      SUPABASE_ANON_KEY: ${SUPABASE_LOCAL_ANON_KEY:?Set SUPABASE_LOCAL_ANON_KEY from supabase status}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_LOCAL_SERVICE_ROLE_KEY:?Set SUPABASE_LOCAL_SERVICE_ROLE_KEY from supabase status}
      # Development-only fallback. Production must inject a secret from its
      # secret manager and never reuse this value.
      JWT_SECRET_KEY: ${JWT_LOCAL_PLAYBACK_SECRET:-local_only_playback_secret_change_me_2026_64_chars_minimum}
      # Local checkout exercises the complete application flow without
      # contacting Stripe or requiring real payment credentials.
      PAYMENT_PROVIDER: fake

  video-worker:
    environment:
      SUPABASE_URL: http://host.docker.internal:54321
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_LOCAL_SERVICE_ROLE_KEY:?Set SUPABASE_LOCAL_SERVICE_ROLE_KEY from supabase status}

  frontend:
    build:
      args:
        BUILD_ENV: development
        API_BASE_URL: http://localhost:8000
        PUBLIC_WEB_URL: http://localhost:18080
        SUPABASE_URL: http://localhost:54321
        SUPABASE_ANON_KEY: ${SUPABASE_LOCAL_ANON_KEY:?Set SUPABASE_LOCAL_ANON_KEY from supabase status}
