name: Release Candidate CI

on:
  pull_request:
  push:
    branches: [main, staging, develop, "refactor/**", "codex/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.0"
  SUPABASE_CLI_VERSION: "2.109.1"
  TEST_DEFINES: >-
    --dart-define=ENV=dev
    --dart-define=SUPABASE_URL=https://mock.supabase.co
    --dart-define=SUPABASE_ANON_KEY=mock-anon-key
    --dart-define=API_BASE_URL=http://localhost:8000

jobs:
  database-and-local-e2e:
    name: Database reset, lint, pgTAP, fixtures, and RLS
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v2
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
          github-token: ${{ github.token }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Start isolated local Supabase
        run: supabase start
      - name: Rebuild database from all migrations
        run: supabase db reset --local --no-seed --yes
      - name: Lint database
        run: supabase db lint --local --level warning
      - name: Run Supabase database tests
        run: supabase test db --local
      - name: Test publication concurrency with two PostgreSQL connections
        shell: pwsh
        run: ./scripts/ci/test-course-publication-concurrency.ps1
      - name: Load local E2E fixtures and validate login and RLS
        shell: pwsh
        run: |
          ./scripts/load-local-fixtures.ps1 `
            -StudentPassword 'CI-Local-Student-2026!' `
            -TeacherPassword 'CI-Local-Teacher-2026!'
      - name: Install backend for local E2E
        run: python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Run teacher authoring through Auth, FastAPI, and Supabase
        shell: bash
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          export APP_ENV=development
          export SUPABASE_URL="$API_URL"
          export SUPABASE_ANON_KEY="$ANON_KEY"
          export SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          export STRIPE_SECRET_KEY=sk_test_local_only
          export STRIPE_WEBHOOK_SECRET=whsec_local_only

          python -m uvicorn src.main:app \
            --app-dir backend \
            --host 127.0.0.1 \
            --port 8000 \
            >"$RUNNER_TEMP/local-backend.log" 2>&1 &
          backend_pid=$!
          cleanup_backend() {
            kill "$backend_pid" 2>/dev/null || true
            wait "$backend_pid" 2>/dev/null || true
          }
          trap cleanup_backend EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null; then
              break
            fi
            if ! kill -0 "$backend_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/local-backend.log"
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8000/health >/dev/null || {
            cat "$RUNNER_TEMP/local-backend.log"
            exit 1
          }

          if ! pwsh ./scripts/ci/test-teacher-authoring-e2e.ps1 \
              -BackendUrl 'http://127.0.0.1:8000' \
              -SupabaseUrl "$API_URL" \
              -SupabaseAnonKey "$ANON_KEY" \
              -SupabaseServiceRoleKey "$SERVICE_ROLE_KEY" \
              -TeacherPassword 'CI-Local-Teacher-2026!'; then
            cat "$RUNNER_TEMP/local-backend.log"
            exit 1
          fi
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

  backend:
    name: Backend quality and container
    needs: database-and-local-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install locked backend inputs
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Ruff
        run: python -m ruff check src tests conftest.py
      - name: Mypy
        run: python -m mypy src
      - name: Compile
        run: python -m compileall -q src
      - name: Test
        run: python -m pytest -q --junitxml=test-results.xml
      - name: Upload backend test report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: release-candidate-backend-tests
          path: backend/test-results.xml
          if-no-files-found: error
          retention-days: 14
      - name: Build API container without publishing
        working-directory: .
        run: docker build --file backend/Dockerfile --tag lawrence-api:release-candidate backend

  flutter:
    name: Flutter analyze, tests, and release builds
    needs: database-and-local-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: lawrence
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve locked Flutter dependencies
        run: flutter pub get --enforce-lockfile
      - name: Analyze
        run: flutter analyze --no-pub
      - name: Test
        run: flutter test --no-pub $TEST_DEFINES
      - name: Build Web
        run: flutter build web --release $TEST_DEFINES
      - name: Build unsigned Android App Bundle
        run: flutter build appbundle --release $TEST_DEFINES

  release-candidate-gate:
    name: Release candidate gate
    if: always()
    needs:
      - database-and-local-e2e
      - backend
      - flutter
    runs-on: ubuntu-latest
    steps:
      - name: Require every gate from this commit
        env:
          DATABASE_RESULT: ${{ needs.database-and-local-e2e.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          FLUTTER_RESULT: ${{ needs.flutter.result }}
        run: |
          test "$DATABASE_RESULT" = "success"
          test "$BACKEND_RESULT" = "success"
          test "$FLUTTER_RESULT" = "success"
