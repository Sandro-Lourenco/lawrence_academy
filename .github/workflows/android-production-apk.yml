name: Android Production APK

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: Public HTTPS API origin
        required: true
        type: string
      public_web_url:
        description: Public HTTPS web origin used by payment returns
        required: true
        type: string
      supabase_url:
        description: Production Supabase HTTPS URL
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: android-production-apk
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.44.9"

jobs:
  build:
    name: Test and build signed production APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: lawrence
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Validate release inputs
        shell: bash
        env:
          API_BASE_URL: ${{ inputs.api_base_url }}
          PUBLIC_WEB_URL: ${{ inputs.public_web_url }}
          SUPABASE_URL: ${{ inputs.supabase_url }}
        run: |
          for value in "$API_BASE_URL" "$PUBLIC_WEB_URL" "$SUPABASE_URL"; do
            case "$value" in
              https://*) ;;
              *) echo "All production endpoints must use HTTPS." >&2; exit 1 ;;
            esac
          done
      - name: Restore release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/lawrence-release.jks"
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Analyze
        run: flutter analyze --no-pub
      - name: Test
        run: >-
          flutter test --no-pub
          --dart-define=ENV=dev
          --dart-define=API_BASE_URL=http://localhost:8000
          --dart-define=SUPABASE_URL=https://mock.supabase.co
          --dart-define=SUPABASE_ANON_KEY=mock-anon-key
      - name: Build signed production APK
        env:
          LAWRENCE_KEYSTORE_PATH: ${{ runner.temp }}/lawrence-release.jks
          LAWRENCE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          LAWRENCE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          LAWRENCE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: >-
          flutter build apk --release --flavor production
          --dart-define=ENV=production
          --dart-define=API_BASE_URL=${{ inputs.api_base_url }}
          --dart-define=PUBLIC_WEB_URL=${{ inputs.public_web_url }}
          --dart-define=SUPABASE_URL=${{ inputs.supabase_url }}
          --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
      - name: Upload signed APK
        uses: actions/upload-artifact@v6
        with:
          name: lawrence-academy-production-${{ github.run_number }}
          path: lawrence/build/app/outputs/flutter-apk/app-production-release.apk
          if-no-files-found: error
          retention-days: 14
