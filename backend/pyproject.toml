[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [
    ".venv",
    ".mypy_cache",
    ".pytest_cache",
    "lost_blobs",
    "temp",
    "temp_pytest_dir",
    "extracted_replacements.py",
    "temp_blob.py",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
