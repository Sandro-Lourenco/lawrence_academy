name: lawrence
description: "Lawrence Academy"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  supabase_flutter: ^2.6.0
  video_player: ^2.8.6
  dio: ^5.10.0
  http: ^1.6.0
  crypto: ^3.0.7
  encrypt: ^5.0.3
  go_router: ^17.3.0
  path_provider: ^2.1.6
  path: ^1.9.1
  sqflite: ^2.4.3
  url_launcher: ^6.3.2
  uuid: ^4.5.3
  intl: ^0.20.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  workmanager: ^0.9.0+3
  connectivity_plus: ^7.2.0
  flutter_secure_storage: ^10.3.1
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  file_picker: 10.3.10
  web: ^1.1.1
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  flutter_svg: ^2.3.0
  file_saver: ^0.4.0
  share_plus: ^12.0.2
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  assets:
    - assets/brand/logo-lawrence.png
    - assets/brand/lawrence-footer-signature.svg
    - assets/images/landing_hero.webp
    - assets/images/hero_sewing.jpg
    - assets/images/pattern_drafting.webp
    - assets/images/atelier_sewing.webp
    - assets/images/creator-lawrence.jpeg
    - assets/images/10-anos-dourado.svg
    - assets/images/couture_atelier_hero.webp
    - assets/images/couture_draping_portrait.webp
    - assets/images/couture_pattern_table.webp
    - assets/images/maison_lawrence_hero.webp
    - assets/images/login_atelier_editorial.webp
