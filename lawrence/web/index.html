<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Lawrence Academy — formação premium em costura, modelagem, moda e estilo.">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Lawrence Academy">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Lawrence Academy | Costura, modelagem, moda e estilo</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
<script>
  (async function startLawrenceAcademy() {
    try {
      if ('serviceWorker' in navigator) {
        const registrations = await navigator.serviceWorker.getRegistrations();
        await Promise.all(registrations.map((registration) => registration.unregister()));
      }

      if ('caches' in window) {
        const cacheNames = await caches.keys();
        const legacyFlutterCaches = cacheNames.filter((name) =>
          name === 'flutter-app-cache' || name === 'flutter-temp-cache'
        );
        await Promise.all(legacyFlutterCaches.map((name) => caches.delete(name)));
      }
    } catch (error) {
      console.warn('Não foi possível limpar o cache legado do Flutter.', error);
    } finally {
      const bootstrap = document.createElement('script');
      bootstrap.src = 'flutter_bootstrap.js';
      document.body.appendChild(bootstrap);
    }
  })();
</script>
</body>
</html>
