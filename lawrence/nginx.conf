server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Flutter service workers antigos podiam manter todo o app desatualizado.
    # O build atual não usa PWA cache e navegadores legados devem desregistrá-lo.
    location = /flutter_service_worker.js {
        try_files $uri =404;
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
    }

    # Flutter shell files keep stable names while their contents change on
    # every release. They must always be revalidated to avoid serving an old
    # application after a container update.
    location ~* ^/(?:index\.html|flutter_bootstrap\.js|main\.dart\.js)$ {
        try_files $uri =404;
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"healthy"}';
    }

    location ~* \.(?:css|wasm|png|jpg|jpeg|gif|svg|webp|ico|woff|woff2)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
